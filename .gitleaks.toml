# Gitleaks config: default rules plus allow-listed, clearly fake development values.
[extend]
useDefault = true

[allowlist]
description = "Development-only placeholders that are documented as such"
regexes = ['''owner_dev_only''', '''app_dev_only''', '''postgres_dev_only''', '''postgres_ci_only''', '''CHANGE_ME''', '''abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG''']
paths = ['''docs/.*\.json''', '''(^|/)\.next/''', '''(^|/)node_modules/''']
