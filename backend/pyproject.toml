[project]
name = "pipelineos"
version = "0.2.0"
description = "PipelineOS backend: compliance-first multi-agent outbound system"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery>=5.4",
  "redis>=5.0",
  "anthropic>=0.40",
  "httpx>=0.27",
  "tenacity>=9.0",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "structlog>=24.4",
  "holidays>=0.57",
  "pyyaml>=6.0",
  "pgvector>=0.3",
  "typer>=0.12",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "faker>=28",
  "respx>=0.21",
  "time-machine>=2.15",
]

[project.scripts]
pipelineos = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF012", "S105", "S106", "PLC0415", "B008", "N818", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S107", "S603", "S608", "PLW1510", "RUF043"]
"migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*", "pyotp.*", "holidays.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workflows.celery_app"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["db: requires PostgreSQL"]

[tool.coverage.run]
source = ["app"]
