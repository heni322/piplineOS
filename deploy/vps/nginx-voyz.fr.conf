# voyz.fr on the server's existing nginx (container cdnkt_nginx). Copy into that nginx's conf.d directory, test with
# `docker exec cdnkt_nginx nginx -t`, then `docker exec cdnkt_nginx nginx -s reload`. It only adds voyz.fr:
# the other sites on this nginx are untouched.
#
# Before the certificate exists, use only the first server block (port 80) so certbot can answer its challenge;
# add the 443 block after `certbot certonly` succeeded (docs/DEPLOY-VPS.md, step 5).

server {
    listen 80;
    listen [::]:80;
    server_name voyz.fr www.voyz.fr;

    # Let's Encrypt HTTP challenge, served from the same webroot the existing certbot container uses
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://voyz.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voyz.fr www.voyz.fr;

    ssl_certificate     /etc/letsencrypt/live/voyz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voyz.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.voyz.fr) { return 301 https://voyz.fr$request_uri; }

    client_max_body_size 10m;
    location = /metrics { return 404; }

    location / {
        # Caddy on the shared voyz_edge network; resolved at request time so nginx still starts if PipelineOS is down
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $pipelineos http://pipelineos-edge:80;
        proxy_pass $pipelineos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
