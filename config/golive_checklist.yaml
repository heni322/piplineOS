# Code creates these items; ONLY the operator signs them off in the dashboard (MFA required).
# PipelineOS runs from France (LYLIUM SAS): the checklist that gates real sending is the French one (scope "fr").
items:
  - key: fr.lawyer_review
    scope: fr
    title: Revue par un avocat (droit français, CNIL)
    description: >-
      Configuration de conformité, pied de page des e-mails, politique de confidentialité, analyse des intérêts
      légitimes (LIA) et DPA validés au regard du RGPD, de la loi Informatique et Libertés et de la doctrine CNIL sur
      la prospection B2B par e-mail (CPCE art. L.34-5) ; ainsi que les modèles de réponse aux demandes RGPD, la
      mention d'usage de l'IA, ce qui est conservé après effacement et les listes de mots-clés de sécurité des
      réponses.
  - key: fr.records_of_processing
    scope: fr
    title: Registre des activités de traitement à jour
    description: >-
      Registre (RGPD art. 30) tenant compte de la prospection, des sources de données, des sous-traitants (hébergeur,
      Google, Brevo ou fournisseur de messagerie) et des durées de conservation.
  - key: fr.transfer_documents
    scope: fr
    title: Documents de transfert hors UE
    description: >-
      Clauses contractuelles types (CCT) de l'UE et analyse d'impact des transferts pour l'accès de l'opérateur depuis
      la Tunisie, et pour chaque sous-traitant situé hors de l'UE.
  - key: fr.vat_invoicing
    scope: fr
    title: TVA et facturation validées par un expert-comptable
    description: >-
      Régime de TVA de LYLIUM SAS, mentions obligatoires sur les factures françaises, et règles de TVA
      (config/tax_rules.yaml) validées.
  - key: fr.deliverability
    scope: fr
    title: Délivrabilité prête
    description: Domaines d'envoi chauffés ; SPF, DKIM et DMARC vérifiés pour chaque domaine d'envoi.
