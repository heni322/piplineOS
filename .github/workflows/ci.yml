# Continuous integration: the same gates as scripts/ci.sh, plus secret and container scanning.
# Actions are pinned to major versions; pin to commit SHAs once the repository is on GitHub (see DEPLOYMENT.md).
name: ci
on:
  push: { branches: [main, "phase/**"] }
  pull_request: {}
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres_ci_only }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres_ci_only@127.0.0.1:5433/postgres
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.26" }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python -c "from app.llm.prompts import check_lock; import sys; p = check_lock(); print(*p, sep='\n'); sys.exit(1 if p else 0)"
      - run: uv run pytest -q
      - run: uv run pip-audit --progress-spinner off --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      # Accepted, documented exception (R12): braces, dev-only via eslint-config-next. Fail on anything critical.
      - run: pnpm audit --audit-level critical

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres_ci_only }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres_ci_only@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.26" }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$TEST_PG_ADMIN_URL" -c "CREATE ROLE pipelineos_owner LOGIN PASSWORD 'owner_dev_only'" -c "CREATE ROLE pipelineos_app LOGIN PASSWORD 'app_dev_only' NOBYPASSRLS"
      - run: cd backend && uv sync --frozen
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: bash scripts/e2e-fullstack.sh

  security:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build images
        run: |
          docker build -t pipelineos/backend:ci backend
          docker build -t pipelineos/web:ci frontend
          docker build -t pipelineos/backup:ci -f deploy/backup.Dockerfile .
      - name: Scan images (fail on high/critical with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: pipelineos/backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: image, image-ref: pipelineos/web:ci, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1" }
